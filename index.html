<style>
:root{
  --bg:#f6f7fb; --bg2:#edeef8;
  --surface:#ffffff; --surface-2:#f7f8fc; --surface-3:#eef1f9;
  --text:#10132b; --muted:#4b5468; --faint:#6b7280;
  --primary:#4f46e5; --primary-2:#4338ca; --primary-d:#3730a3; --primary-soft:#eef2ff;
  --accent:#7c3aed; --accent-soft:#f3e8ff;
  --border:#dcdfee; --border-2:#e8eaf4;
  --ok:#16a34a; --ok-bg:#ecfdf5; --bad:#dc2626; --bad-bg:#fef2f2;
  --warn:#d97706; --warn-bg:#fffbeb; --flag:#7c3aed;
  --ring-track:#e6e8f4;
  --grad:linear-gradient(135deg,#6366f1,#7c3aed);
  --shadow-s:0 1px 2px rgba(30,27,75,.05), 0 1px 3px rgba(30,27,75,.06);
  --shadow:0 6px 18px rgba(30,27,75,.10);
  --shadow-l:0 14px 38px rgba(30,27,75,.16);
  --radius:16px; --radius-s:12px; --focus:#4f46e5;
  --fs:1; /* user font-scale multiplier (A-/A+) */
}
html[data-theme="dark"]{
  --bg:#0f172a; --bg2:#1a202c;
  --surface:#1e293b; --surface-2:#334155; --surface-3:#475569;
  --text:#f1f5f9; --muted:#cbd5e1; --faint:#94a3b8;
  --primary:#6366f1; --primary-2:#4f46e5; --primary-d:#a5b4fc; --primary-soft:#312e81;
  --accent:#a78bfa; --accent-soft:#2e1065;
  --border:#3a4358; --border-2:#475069;
  --ok:#22c55e; --ok-bg:#064e3b; --bad:#ef4444; --bad-bg:#7f1d1d;
  --warn:#f59e0b; --warn-bg:#451a03; --flag:#c084fc;
  --ring-track:#3a4358;
  --grad:linear-gradient(135deg,#6366f1,#8b5cf6);
  --shadow-s:0 1px 2px rgba(0,0,0,.4); --shadow:0 4px 12px rgba(0,0,0,.5); --shadow-l:0 8px 24px rgba(0,0,0,.6);
  --focus:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Assistant','Heebo','Segoe UI',system-ui,-apple-system,Arial,'Noto Sans Hebrew',sans-serif;
  color:var(--text); line-height:1.65; font-size:calc(17px * var(--fs)); min-height:100vh;
  background:linear-gradient(180deg,var(--bg2),var(--bg) 220px);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.appbar{position:sticky;top:0;z-index:40;backdrop-filter:saturate(1.3) blur(8px);
  background:color-mix(in srgb, var(--surface) 86%, transparent); border-bottom:1px solid var(--border)}
.appbar .row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:11px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.04rem;letter-spacing:-.01em}
.logo .mark{width:33px;height:33px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:17px;
  background:var(--primary)}
.appbar .sp{flex:1}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(106px + env(safe-area-inset-bottom))}
main:focus{outline:none}

button,.btn{font-family:inherit;cursor:pointer}
.icbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);display:grid;place-items:center;font-size:1.05rem;transition:.15s}
.icbtn:hover{background:var(--surface-2)}
.btn{border:none;border-radius:13px;padding:14px 20px;min-height:52px;font-size:1.04rem;font-weight:600;
  background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(30,64,175,.15);
  transition:background .15s, box-shadow .15s;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn:hover{background:var(--primary-2);box-shadow:0 4px 12px rgba(30,64,175,.25)} .btn:active{opacity:0.95}
.btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-2);box-shadow:var(--shadow-s)}
.btn.secondary:hover{background:var(--surface-2)}
.btn.ghost{background:transparent;color:var(--primary-d);border:1px solid var(--border-2);box-shadow:none;min-height:44px;padding:10px 16px;font-size:.96rem}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.wide{width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.btn:focus-visible,.icbtn:focus-visible{outline-offset:3px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.stack > *{margin-top:14px}
.stack > *:first-child{margin-top:0}
h1{font-size:1.42rem;margin:0;letter-spacing:-.01em;font-weight:700} h2{font-size:1.14rem;margin:0 0 2px;font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.screen{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* hero (clinical: clean card, teal top rule) */
.hero{border-top:4px solid var(--primary)}
.hero .greet{font-size:.8rem;font-weight:800;letter-spacing:.04em;color:var(--primary-d);text-transform:none}
.herorow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.kic{font-size:.78rem;font-weight:700;color:var(--muted)}
.bignum{font-size:2.1rem;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.bar-h{height:10px;border-radius:999px;background:var(--ring-track);overflow:hidden;margin:12px 0}
.bar-h > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s}
.hero .sub{font-size:.9rem}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:right;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-s);
  padding:16px;display:flex;flex-direction:column;gap:6px;min-height:104px;box-shadow:var(--shadow-s);
  transition:transform .14s, box-shadow .18s, border-color .15s;cursor:pointer}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--primary)}
.tile .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.2rem;
  background:var(--primary-soft);color:var(--primary-d)}
.tile.accent .ic{background:var(--accent-soft);color:var(--accent)}
.tile .t{font-weight:600;font-size:1.02rem} .tile .d{font-size:.81rem;color:var(--muted);line-height:1.4}
.tile .badge{position:absolute;inset-inline-start:14px;top:14px;background:var(--bad);color:#fff;border-radius:999px;
  min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;font-size:.74rem;font-weight:800}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:1.26rem;line-height:1.2} .stat span{font-size:.73rem;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:.8rem;font-weight:800}
.chip.blue,.chip.teal{background:var(--primary-soft);color:var(--primary-d)}
.chip.green{background:var(--ok-bg);color:var(--ok)}
.chip.red{background:var(--bad-bg);color:var(--bad)}
.chip.orange{background:var(--warn-bg);color:var(--warn)}

.topiclist{display:grid;gap:10px}
.topic{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--border);border-radius:var(--radius-s);
  background:var(--surface);cursor:pointer;text-align:right;width:100%;min-height:62px;box-shadow:var(--shadow-s);
  transition:transform .1s, border-color .15s, background .15s}
.topic:hover{background:var(--surface-2);border-color:var(--primary);transform:translateX(-3px)}
.topic .num{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:600;flex:none;
  background:var(--primary-soft);color:var(--primary-d)}
.topic .tname{flex:1;font-weight:600;font-size:1rem} .topic .meta{color:var(--muted);font-size:.82rem;white-space:nowrap}
.topic .mini{height:6px;border-radius:999px;background:var(--ring-track);overflow:hidden;width:70px;margin-top:5px}
.topic .mini > i{display:block;height:100%;background:var(--primary)}

.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qprog{height:8px;border-radius:999px;background:var(--ring-track);overflow:hidden;margin:14px 0}
.qprog > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s}
.qmeta{color:var(--muted);font-size:.86rem;font-weight:600}
.qtext{font-size:1.18rem;font-weight:800;margin:10px 0 18px;line-height:1.5;white-space:pre-wrap}
.opts{display:grid;gap:11px}
.opt{display:flex;gap:13px;align-items:center;text-align:right;width:100%;padding:15px 16px;border:1.5px solid var(--border-2);
  border-radius:13px;background:var(--surface);cursor:pointer;min-height:58px;transition:border-color .14s, background .14s, transform .08s}
.opt:hover{border-color:var(--primary);background:var(--surface-2)} .opt:active{transform:scale(.994)}
.opt .lett{width:31px;height:31px;border-radius:9px;background:var(--surface-3);font-weight:800;display:grid;place-items:center;flex:none;transition:.14s}
.opt .otext{flex:1}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)} .opt.sel .lett{background:var(--primary);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-bg);animation:pop .3s} .opt.correct .lett{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s} .opt.wrong .lett{background:var(--bad);color:#fff}
.opt[aria-disabled="true"]{cursor:default}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.feedback{margin-top:16px;padding:16px;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);animation:rise .22s both}
.feedback.ok{border-color:var(--ok);background:var(--ok-bg);border-inline-start:4px solid var(--ok)}
.feedback.bad{border-color:var(--bad);background:var(--bad-bg);border-inline-start:4px solid var(--bad)}
.feedback .src{color:var(--muted);font-size:.83rem;margin-top:9px;display:flex;gap:6px;align-items:flex-start}
.optwhy{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.optwhy .owttl{font-size:.84rem;font-weight:800;color:var(--muted);margin-bottom:-2px}
.optwhy .ok-ttl{color:var(--ok)}
.optwhy .wrong-ttl{color:var(--bad);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.owrow{padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface)}
.owrow.ok{border-color:var(--ok);background:var(--ok-bg)}
.owrow.bad{border-color:var(--bad);background:var(--bad-bg)}
.owrow .owh{display:flex;gap:8px;align-items:flex-start;font-weight:600;line-height:1.45}
.owrow .owi{flex:none;width:1.3em;text-align:center;font-weight:800}
.owrow.ok .owi{color:var(--ok)} .owrow.bad .owi{color:var(--bad)} .owrow.neu .owi{color:var(--muted)}
.owrow .owwhy{margin-top:5px;padding-inline-start:calc(1.3em + 8px);font-size:.9rem;color:var(--text);opacity:.92;line-height:1.5}
.owrow .owt{font-weight:700}
.owrow{animation:owin .34s both}
@keyframes owin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .owrow{animation:none} }
.chartwrap{width:100%;margin-top:6px}
.chartwrap svg{width:100%;height:auto;display:block;overflow:visible}
.chartwrap .axlbl{fill:var(--faint);font-size:9px;font-weight:700}
.chartwrap .tgtlbl{fill:var(--ok);font-size:9px;font-weight:800}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.78rem;color:var(--muted)}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.clgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.cltog{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1.5px solid var(--border-2);border-radius:11px;background:var(--surface);cursor:pointer;text-align:right;transition:border-color .14s,background .14s;font-size:.86rem}
.cltog:hover:not(:disabled){border-color:var(--primary)}
.cltog .cn{width:25px;height:25px;border-radius:7px;background:var(--surface-3);color:var(--muted);font-weight:800;display:grid;place-items:center;flex:none;font-size:.8rem;transition:.14s}
.cltog.on{border-color:var(--primary);background:var(--primary-soft)} .cltog.on .cn{background:var(--primary);color:#fff}
.cltog .cnm{flex:1;font-weight:700;line-height:1.18} .cltog .ccount{color:var(--faint);font-size:.72rem;font-weight:600}
.rangewrap{display:flex;align-items:center;gap:13px;margin-top:10px}
input[type=range].qrange{flex:1;accent-color:var(--primary);height:6px;cursor:pointer}
.rangeval{font-weight:800;font-size:1.3rem;color:var(--primary-d);min-width:2.4em;text-align:center}
html[data-theme="dark"] .rangeval{color:#aab4ff}
.navrow{display:flex;gap:11px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:9px 13px;display:inline-flex;gap:7px;align-items:center}
.flagbtn.on{background:var(--flag);color:#fff;border-color:var(--flag)}

details.gnav{margin-top:16px;border:1px solid var(--border);border-radius:13px;overflow:hidden;background:var(--surface-2)}
details.gnav > summary{cursor:pointer;padding:13px 16px;font-weight:800;list-style:none}
details.gnav > summary::-webkit-details-marker{display:none}
details.gnav > summary::before{content:"▾ ";color:var(--primary-d)}
.gridnav{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:0 14px 14px}
@media(max-width:540px){.gridnav{grid-template-columns:repeat(8,1fr)}}
@media (max-width: 620px) {
  body { font-size: calc(16px * var(--fs)); }
  .card { padding: 16px; }
  .btn { padding: 12px 16px; min-height: 48px; font-size: 0.95rem; }
  .tiles { grid-template-columns: 1fr; gap: 10px; }
  .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat { padding: 10px 6px; }
  .qtext { font-size: calc(clamp(15px, 4vw, 18px) * var(--fs)); line-height: 1.6; }
  .opt { padding: 12px 14px; min-height: 54px; }
  .appbar .row { gap: 4px; }
  .icbtn { width: 36px; height: 36px; font-size: 0.95rem; }
  .icbtn.fsbtn { font-size: 0.8rem; }
  .logo { font-size: 0.95rem; }
  .chip { font-size: 0.75rem; padding: 4px 10px; }
  .tabnav { bottom: calc(10px + env(safe-area-inset-bottom)); max-width: calc(100% - 16px); }
  .tabnav button { min-width: 50px; min-height: 48px; font-size: 0.65rem; }
  details.gnav { margin-top: 12px; }
  .gridnav { gap: 4px; }
  .gridnav button { min-height: 36px; font-size: 0.8rem; }
}
.gridnav button{min-height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-weight:800;font-size:.86rem}
.gridnav button.answered{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-d)}
.gridnav button.flagged{box-shadow:inset 0 0 0 2px var(--flag)}
.gridnav button.current{background:var(--primary);color:#fff;border-color:transparent}

.bigring{display:flex;flex-direction:column;align-items:center;gap:4px}
.breakdown{display:grid;gap:9px;margin-top:8px}
.brow{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow-s)}
.brow .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brow .bar2{height:8px;border-radius:999px;background:var(--ring-track);overflow:hidden;margin-top:8px}
.brow .bar2 > i{display:block;height:100%}
.tipbox{margin-top:10px;padding:14px;border-radius:12px;background:var(--warn-bg);border:1px solid var(--warn);border-inline-start:4px solid var(--warn)}
.tipbox.good{background:var(--ok-bg);border-color:var(--ok);border-inline-start-color:var(--ok)}
.tipbox ul{margin:8px 0 0;padding-inline-start:20px} .tipbox li{margin:3px 0}

.search{width:100%;padding:14px 16px;border:1px solid var(--border-2);border-radius:13px;background:var(--surface-2);
  color:var(--text);font-size:1rem;font-family:inherit}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{padding:10px 15px;border-radius:999px;border:1px solid var(--border-2);background:var(--surface);font-weight:800;min-height:44px;font-size:.9rem;transition:.14s}
.tab.active{background:var(--primary);color:#fff;border-color:transparent}
.gcat{margin-top:14px} .gcat h2{margin-bottom:8px}
.gitem{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border)}
.gitem b{color:var(--primary-d);white-space:nowrap}
.gcl-badge{display:inline-block;font-size:.62rem;font-weight:800;color:var(--muted);background:var(--surface-3);border-radius:6px;padding:1px 5px;vertical-align:1px;white-space:nowrap}
.gsub{margin:16px 0 2px;font-weight:800;font-size:.82rem;color:var(--primary-d);background:var(--primary-soft);border-radius:8px;padding:6px 11px;display:inline-block}
select.search{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(0% + 16px) calc(50% - 2px),calc(0% + 21px) calc(50% - 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.gloss-link{color:var(--primary-d);font-weight:700;border-bottom:1px dashed color-mix(in srgb,var(--primary) 55%,transparent);cursor:pointer}
.gloss-link:hover{background:var(--primary-soft);border-radius:3px}
.gpop-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:110;display:flex;align-items:center;justify-content:center;padding:16px}
.gpop{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-l);padding:18px;max-width:380px;animation:rise .2s both}
.gpop h3{margin:0 0 8px;color:var(--primary-d);font-size:1.05rem}
.gpop .gpv{line-height:1.6}
.gpop .gpc{margin-top:12px;width:100%}
.sheet{background:var(--surface);border:1px solid var(--border);border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:var(--shadow-l);padding:18px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:760px;animation:sheetup .25s cubic-bezier(.2,.7,.3,1) both}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}

.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-h .icbtn{position:static}
.st-row{display:flex;align-items:center;justify-content:space-between;font-weight:600}
.st-fs{display:inline-flex;align-items:center;gap:10px}
.st-fs .btn.ghost{min-height:40px;padding:6px 14px;font-weight:800}
.st-fs b{min-width:3.2em;text-align:center}
.st-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 15px;border:1px solid var(--border-2);border-radius:13px;background:var(--surface);font-weight:600;font-size:1rem;color:var(--text)}
.st-toggle .st-sw{width:46px;height:26px;border-radius:999px;background:var(--ring-track);position:relative;transition:.18s;flex:none}
.st-toggle .st-sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.18s}
.st-toggle.on{border-color:var(--primary);background:var(--primary-soft)}
.st-toggle.on .st-sw{background:var(--primary)}
.st-toggle.on .st-sw::after{inset-inline-start:23px}

.tabnav{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:2px;padding:6px;border-radius:18px;background:color-mix(in srgb,var(--surface) 94%,transparent);
  border:1px solid var(--border);box-shadow:var(--shadow-l);backdrop-filter:saturate(1.4) blur(10px);max-width:calc(100% - 24px)}
.tabnav.hide{display:none}
.tabnav button{border:none;background:transparent;border-radius:13px;padding:8px 12px;min-width:60px;min-height:52px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-weight:700;font-size:.72rem;transition:.15s;position:relative}
.tabnav button .ti{font-size:1.2rem;line-height:1}
.tabnav button.active{color:#fff;background:var(--primary)}
.tabnav button:not(.active):hover{background:var(--surface-2);color:var(--text)}
.tabnav .dot{position:absolute;top:5px;inset-inline-start:50%;width:7px;height:7px;border-radius:50%;background:var(--bad)}

.hidden{display:none!important}
.skip{position:absolute;right:-9999px;top:auto}
.skip:focus{position:fixed;right:12px;top:12px;background:var(--primary);color:#fff;padding:10px 14px;border-radius:10px;z-index:100}
.foot{text-align:center;color:var(--faint);font-size:.8rem;padding:8px 0 0}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-l);z-index:70;
  opacity:0;transition:.25s;pointer-events:none;font-weight:700;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
kbd{background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-family:monospace;font-size:0.85em;font-weight:600;color:var(--text);display:inline-block;margin:0 2px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.stack{display:grid;gap:14px}

/* ===================== visual refresh v2 ===================== */
body{
  background:

}
.appbar{background:color-mix(in srgb,var(--surface) 80%,transparent)}

.bar-h>i,.qprog>i{background:var(--grad)}

.tile.accent .ic{background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff}
.tile:hover{box-shadow:var(--shadow-l);border-color:transparent}
.stat{background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.topic .num{background:var(--grad);color:#fff}

/* overflow safety: prevent horizontal clipping (flex items must be able to shrink) */

/* ===================== dark mode contrast & polish ===================== */
html[data-theme="dark"]{
  --bg:#0e1322; --bg2:#141a2c;
  --surface:#1b2236; --surface-2:#28324c; --surface-3:#3a4763;
  --text:#f3f6fc; --muted:#c4cdde; --faint:#94a2b8;
  --border:#3b4763; --border-2:#4a5874;
  /* success/error/soft tints retuned for dark so text stays readable on them */
  --ok:#34d399; --ok-bg:#10301f; --bad:#f87171; --bad-bg:#3a1822;
  --warn:#fbbf24; --warn-bg:#3a2c10;
  --primary-soft:#242a52; --accent-soft:#2a1f47; --ring-track:#2c3550;
}
html[data-theme="dark"] body{
  background:
    radial-gradient(900px 340px at 100% -8%, rgba(139,92,246,.13), transparent 62%),
    linear-gradient(180deg,var(--bg2),var(--bg) 360px);
}
html[data-theme="dark"] .card,html[data-theme="dark"] .tile,html[data-theme="dark"] .stat,
html[data-theme="dark"] .brow,html[data-theme="dark"] .topic{box-shadow:0 10px 26px rgba(0,0,0,.42)}

html[data-theme="dark"] .tile .d,html[data-theme="dark"] .topic .meta{color:#aab6c9}

/* ===================== A-/A+ text-size buttons ===================== */
.icbtn.fsbtn{font-weight:800;font-size:.95rem;letter-spacing:-.02em}
.icbtn.fsbtn:disabled{opacity:.4;cursor:default}

/* ===================== high-contrast mode (WCAG) ===================== */
html[data-contrast="high"]{
  --muted:#1f2430; --faint:#2a2f3a;
  --border:#0b1020; --border-2:#0b1020; --ring-track:#9aa3b8;
  --primary-d:#2a1d8f; --primary-soft:#e3e6ff;
  --ok:#0c7a32; --bad:#b91c1c; --warn:#9a5b00;
}
html[data-contrast="high"][data-theme="dark"]{
  --muted:#eef2fb; --faint:#dbe2f0;
  --border:#f3f6fc; --border-2:#f3f6fc; --ring-track:#cfd6e6;
  --primary-d:#cbd3ff; --primary-soft:#1d2550;
  --ok:#5ef0a3; --bad:#ff9a9a; --warn:#ffcf5a;
}
html[data-contrast="high"] .card,
html[data-contrast="high"] .tile,
html[data-contrast="high"] .topic,
html[data-contrast="high"] .opt,
html[data-contrast="high"] .brow,
html[data-contrast="high"] .stat,
html[data-contrast="high"] .icbtn,
html[data-contrast="high"] .chip,
html[data-contrast="high"] .feedback,
html[data-contrast="high"] .timer{border-width:2px;border-style:solid}

html[data-contrast="high"] :focus-visible{outline-width:4px;outline-offset:2px}
</style>

<script id="glossary-data" type="application/json">{"אבחונים וכלי הערכה": [{"k": "COPM", "v": "Canadian Occupational Performance Measure — ראיון חצי-מובנה ממוקד-מטופל; המטופל מדרג עיסוקים בעייתיים לפי ביצוע ושביעות רצון (1–10).", "cl": [15, 1, 2], "sub": "תפקוד, ADL וראיון ממוקד-מטופל"}, {"k": "AMPS", "v": "Assessment of Motor and Process Skills — הערכה מבוססת-תצפית; הצופה מדרג ביצוע ADL/IADL בפועל לפי מיומנויות מוטוריות ותהליך. דורש הסמכה.", "cl": [15, 2], "sub": "תפקוד, ADL וראיון ממוקד-מטופל"}, {"k": "FIM", "v": "Functional Independence Measure — מדד עצמאות תפקודית בשיקום; 18 פריטים (מוטורי+קוגניטיבי) בסולם 1–7 (1=תלות מלאה, 7=עצמאות מלאה). נפוץ למעקב שינוי.", "cl": [15, 12, 9], "sub": "תפקוד, ADL וראיון ממוקד-מטופל"}, {"k": "Barthel Index", "v": "מדד Barthel — 10 פעילויות ADL בסיסיות (אכילה, רחצה, לבוש, ניידות, שליטה בסוגרים); מדרג רמת עצמאות. מהיר, נפוץ בשיקום ובגריאטריה.", "cl": [15, 12, 14], "sub": "תפקוד, ADL וראיון ממוקד-מטופל"}, {"k": "Katz ADL", "v": "Katz Index — סולם היררכי ל-6 פעילויות ADL בסיסיות (רחצה, לבוש, שירותים, ניידות, סוגרים, אכילה). נפוץ בגריאטריה.", "cl": [15, 14], "sub": "תפקוד, ADL וראיון ממוקד-מטופל"}, {"k": "MMT", "v": "Manual Muscle Testing — דירוג כוח שריר ידני 0–5 (3=נגד כובד בלבד, 5=נגד התנגדות מלאה).", "cl": [15, 11], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "Jamar / Pinch", "v": "דינמומטר Jamar מודד כוח אחיזה (grip); Pinch gauge מודד כוח צביטה (lateral/tip/three-jaw). מעקב אובייקטיבי.", "cl": [15, 11, 10], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "גוניומטר (Goniometer)", "v": "מד-זווית למדידת טווח תנועה (ROM) במפרק — פעיל (AROM) ופסיבי (PROM); קריטי בשיקום אורתופדי ושל היד.", "cl": [15, 11, 10], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "Semmes-Weinstein / Monofilament", "v": "מונופילמנט להערכת סף תחושת מגע-לחץ; 4.31=תחושת הגנה תקינה/בגבול, 6.65=אובדן תחושת הגנה.", "cl": [15, 10], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "Two-Point Discrimination", "v": "הבחנת שתי נקודות (2PD) — המרחק המינימלי בו מורגשות שתי נקודות כנפרדות; הערכת תחושת דיסקרימינציה לאחר פגיעת/תפר עצב.", "cl": [15, 10], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "Volumeter", "v": "וולומטר — מדידת בצקת בכף היד בשיטת עקירת מים (נפח עקור); מעקב אובייקטיבי אחרי בצקת.", "cl": [15, 10], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "VAS / NPRS", "v": "סולמות כאב לדיווח עצמי — VAS (קו רצף 10 ס\"מ) ו-NPRS (דירוג 0–10); מהירים ובני-מעקב לעוצמת הכאב.", "cl": [15, 9], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "B&B", "v": "Box and Blocks Test — מבדק זריזות-יד גסה: מספר קוביות שמועברות מעל מחיצה בדקה. מהיר, סטנדרטי.", "cl": [15, 10], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "Purdue Pegboard", "v": "מבדק זריזות-יד עדינה (העברת פינים זעירים) ואינטגרציה דו-ידנית.", "cl": [15, 10], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "9-Hole Peg Test", "v": "מבדק זריזות-יד עדינה — תקיעת והוצאת 9 פינים; מהיר ונפוץ למעקב.", "cl": [15, 10], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "FDT", "v": "Functional Dexterity Test — מבדק זריזות תפקודית; היפוך 16 פינים בלוח באחיזת three-jaw chuck (אחיזה פונקציונלית), מדידת זמן עם קנסות. בודק זריזות בשימוש מעשי, להבדיל מ-9-Hole.", "cl": [15, 10], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "Minnesota Dexterity", "v": "Minnesota Manual Dexterity Test — מבדק זריזות-יד גסה: הנחה והיפוך דיסקיות בלוח; להערכת זריזות גסה ותיאום עין-יד תעסוקתי.", "cl": [15, 10], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "Grooved Pegboard", "v": "מבדק זריזות עדינה מורכבת — פינים מחורצים שיש לסובב להתאמה לחור; דורש קואורדינציה ותכנון מוטורי, רגיש לתפקוד נוירולוגי.", "cl": [15, 10, 13], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "DASH", "v": "Disabilities of Arm, Shoulder and Hand — שאלון תפקוד גף עליון בדיווח עצמי.", "cl": [15, 11], "sub": "פיזיקלי, גף עליון ויד"}, {"k": "Do-Eat", "v": "מבדק מבוסס-ביצוע לילדים צעירים (5–7): מעריך תפקוד יומיומי וקוגניציה דרך משימות הכנת מזון יומיומיות.", "cl": [15, 5], "sub": "ילדים והתפתחות"}, {"k": "M-ABC", "v": "Movement ABC — מבדק מוטורי לילדים: זריזות ידנית עדינה, כיוון ותפיסה (Aiming & catching), שיווי משקל. לזיהוי DCD.", "cl": [15, 5, 8], "sub": "ילדים והתפתחות"}, {"k": "BOT-2", "v": "Bruininks-Oseretsky Test of Motor Proficiency — מבדק מקיף ליכולת מוטורית בילדים: זריזות עדינה, אינטגרציה ויזו-מוטורית, זריזות גסה, שיווי משקל, כוח ותיאום דו-צדדי.", "cl": [15, 5, 8], "sub": "ילדים והתפתחות"}, {"k": "GMFCS", "v": "Gross Motor Function Classification System — סיווג תפקוד מוטורי גס ב-CP בחמש רמות (I–V). תקשורתי ובר-מעקב.", "cl": [15, 8], "sub": "ילדים והתפתחות"}, {"k": "MACS", "v": "Manual Ability Classification System — סיווג יכולת השימוש בידיים בחפצים יומיומיים ב-CP (חמש רמות).", "cl": [15, 8], "sub": "ילדים והתפתחות"}, {"k": "PEDI-CAT", "v": "Pediatric Evaluation of Disability Inventory — דיווח מטפל/הורה על תפקוד הילד ב-ADL, ניידות, חברה וקוגניציה; למעקב השתתפות ועצמאות.", "cl": [15, 5, 8], "sub": "ילדים והתפתחות"}, {"k": "SFA", "v": "School Function Assessment — הערכת השתתפות הילד במשימות בית-הספר הלא-אקדמיות (ניידות, ADL בית-ספרי, השתתפות) ע\"י הצוות החינוכי.", "cl": [15, 5, 7], "sub": "ילדים והתפתחות"}, {"k": "COSA", "v": "Child Occupational Self Assessment — הערכה עצמית של הילד (מבוסס MOHO): תפיסת מסוגלות וערך של עיסוקים יומיומיים.", "cl": [15, 5, 1], "sub": "ילדים והתפתחות"}, {"k": "WeeFIM", "v": "גרסת הילדים של FIM — מדד עצמאות תפקודית (טיפול עצמי, ניידות, קוגניציה) לילדים בגיל 6 חודשים–7 שנים.", "cl": [15, 5], "sub": "ילדים והתפתחות"}, {"k": "Sensory Profile", "v": "שאלון של Dunn (הורה/ילד) הממפה דפוסי עיבוד חושי לפי ארבעת הרביעים (רישום נמוך, מחפש, רגיש, נמנע).", "cl": [15, 6], "sub": "עיבוד חושי"}, {"k": "SPM", "v": "Sensory Processing Measure — שאלון עיבוד חושי לבית ולכיתה; ממפה תפקוד חושי, פרקסיס והשתתפות חברתית בהקשרים שונים.", "cl": [15, 6], "sub": "עיבוד חושי"}, {"k": "MVPT", "v": "Motor-Free Visual Perception Test — מבדק תפיסה חזותית ללא רכיב מוטורי (כולל Figure-ground, סגירות).", "cl": [15, 7], "sub": "תפיסה חזותית וכתיבה"}, {"k": "TVPS", "v": "Test of Visual Perceptual Skills — מבדק תפיסה חזותית ללא רכיב מוטורי: אבחנה, זיכרון חזותי, יחסים מרחביים, figure-ground, סגירות וקביעות צורה.", "cl": [15, 7], "sub": "תפיסה חזותית וכתיבה"}, {"k": "DTVP", "v": "Developmental Test of Visual Perception — מבדק תפיסה חזותית התפתחותי המשלב מטלות מוטוריות וללא-מוטוריות; לילדים.", "cl": [15, 7], "sub": "תפיסה חזותית וכתיבה"}, {"k": "Beery-VMI", "v": "מבדק אינטגרציה ויזו-מוטורית (Visual-Motor Integration) — העתקת צורות גיאומטריות בסדר התפתחותי. למדידת קשיי כתיבה.", "cl": [15, 7], "sub": "תפיסה חזותית וכתיבה"}, {"k": "MoCA", "v": "Montreal Cognitive Assessment — סקר קוגניטיבי קצר (ציון עד 30): קשב, זיכרון, שפה, תפקודים מרחביים, הפשטה. רגיש לליקוי קל יותר מ-MMSE.", "cl": [15, 13], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "MMSE", "v": "Mini Mental State Exam — סקר קוגניטיבי גלובלי קצר; פחות רגיש לליקוי קל ולתפקודים ניהוליים.", "cl": [15, 13], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "Cognistat", "v": "סקר קוגניטיבי רב-תחומי (אוריינטציה, קשב, שפה, זיכרון, חישוב, חשיבה) הנותן פרופיל לפי תחום במקום ציון יחיד.", "cl": [15, 13], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "LOTCA / תס\"ש", "v": "Loewenstein OT Cognitive Assessment — סוללת הערכה קוגניטיבית בתת-מבחנים (תפיסה, אוריינטציה, ארגון חזותי), בגרסאות לפי גיל. בנוי bottom-up.", "cl": [15, 13], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "DLOTCA", "v": "גרסה דינמית של LOTCA — כוללת תיווך והערכת פוטנציאל למידה (assessment בתוך התערבות).", "cl": [15, 13], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "Clock Drawing Test", "v": "ציור שעון — סקר קוגניטיבי קצר המעריך תכנון, ארגון מרחבי ותפקוד ניהולי; רגיש לדמנציה.", "cl": [15, 13, 14], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "EFPT", "v": "Executive Function Performance Test — מבדק תפקודי-תפקודים ניהוליים דרך משימות בפועל (למשל הכנת קפה) עם דירוג רמת התיווך הנדרשת.", "cl": [15, 13], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "WCPA", "v": "Weekly Calendar Planning Activity — מבדק תפקודים ניהוליים: תכנון לוח שבועי תוך עמידה בכללים והתעלמות ממסיחים. למתבגרים ומבוגרים.", "cl": [15, 13], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "BADS-C", "v": "Behavioural Assessment of Dysexecutive Syndrome (ילדים) — מבדק תפקודים ניהוליים דרך פתרון בעיות פתוחות וסיטואציות יומיומיות.", "cl": [15, 13], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "TMT", "v": "Trail Making Test (A/B) — חלק A: קשב ומהירות עיבוד; חלק B: מוסיף גמישות קוגניטיבית והחלפת-סט (EF). ההפרש B–A מדד לתפקוד ניהולי.", "cl": [15, 13], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "RBMT", "v": "Rivermead Behavioural Memory Test — מבדק זיכרון יומיומי-תפקודי (זכירת שם, חפץ, מסלול, פגישה); אקולוגי יותר ממבחני זיכרון מסורתיים.", "cl": [15, 13], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "BIT", "v": "Behavioural Inattention Test — מבדק הזנחה חד-צדדית (neglect) המשלב מטלות עט-ונייר (קונבנציונליות) ומטלות תפקודיות-התנהגותיות.", "cl": [15, 13, 12], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "Catherine Bergego (CBS)", "v": "Catherine Bergego Scale — הערכת הזנחה חד-צדדית דרך תצפית ב-10 מצבי ADL; כוללת מדד אנוזוגנוזיה (פער בין דירוג המטפל למטופל).", "cl": [15, 13, 12], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "ACL / אלן", "v": "Allen Cognitive Level — מבדק רמת תפקוד קוגניטיבי (סולם 0–6) דרך משימת תפירת עור; מבוסס מודל Allen.", "cl": [15, 13, 3], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "DPA", "v": "Dynamic Performance Analysis — ניתוח ביצוע דינמי בזמן אמת; כלי המפתח של גישת CO-OP לזיהוי 'נקודת השבירה' בביצוע.", "cl": [15, 5, 13], "sub": "קוגניציה ותפקודים ניהוליים"}, {"k": "MOHOST", "v": "MOHO Screening Tool — כלי סקר מבוסס תצפית להסתגלות עיסוקית (מודל MOHO).", "cl": [15, 1], "sub": "בריאות הנפש ו-MOHO"}, {"k": "OPHI-II", "v": "Occupational Performance History Interview — ראיון היסטוריית ביצוע עיסוקי + סיפור חיים (MOHO); רגיש להסתגלות עיסוקית.", "cl": [15, 1], "sub": "בריאות הנפש ו-MOHO"}, {"k": "OCAIRS", "v": "כלי ראיון מובנה מבוסס MOHO; אוסף פרופיל עיסוקי — היסטוריה, מוטיבציה, דפוסי ביצוע. נפוץ בבריאות הנפש.", "cl": [15, 3], "sub": "בריאות הנפש ו-MOHO"}, {"k": "ACIS", "v": "Assessment of Communication & Interaction Skills — כלי תצפית מבוסס MOHO להערכת מיומנויות תקשורת ואינטראקציה.", "cl": [15, 3], "sub": "בריאות הנפש ו-MOHO"}, {"k": "OSA", "v": "Occupational Self Assessment — הערכה עצמית עיסוקית מבוססת MOHO (תפיסת מסוגלות וערכים).", "cl": [15, 1], "sub": "בריאות הנפש ו-MOHO"}, {"k": "OQ", "v": "Occupational Questionnaire — שאלון עיסוקי לדיווח עצמי על שימוש בזמן (MOHO).", "cl": [15, 1], "sub": "בריאות הנפש ו-MOHO"}, {"k": "Role Checklist", "v": "רשימת תפקידים — דיווח עצמי, גיל 18+; מיפוי תפקידים בעבר/הווה/עתיד ומידת המשמעות שלהם. נפוץ בבריאות הנפש.", "cl": [15, 3], "sub": "בריאות הנפש ו-MOHO"}, {"k": "Interest Checklist", "v": "Modified Interest Checklist — כלי MOHO לדיווח עצמי על תחומי עניין בעבר/הווה/עתיד; בסיס לתכנון פנאי ועיסוק משמעותי.", "cl": [15, 3, 1], "sub": "בריאות הנפש ו-MOHO"}, {"k": "VQ", "v": "Volitional Questionnaire — כלי תצפית מבוסס MOHO להערכת רצון (volition) אצל מי שמתקשה בדיווח עצמי מילולי.", "cl": [15, 3, 1], "sub": "בריאות הנפש ו-MOHO"}, {"k": "BaFPE", "v": "Bay Area Functional Performance Evaluation — מבדק תפקוד בסיסי בבריאות הנפש (מיומנויות תפקודיות וחברתיות).", "cl": [15, 3], "sub": "בריאות הנפש ו-MOHO"}], "גישות ומודלים": [{"k": "MOHO", "v": "Model of Human Occupation — רצון (volition), הרגלים (habituation), יכולת ביצוע. ממדי עשייה: מיומנות, ביצוע, השתתפות.", "cl": [1, 18]}, {"k": "CMOP-E", "v": "Canadian Model of Occupational Performance & Engagement — אדם (פיזי/קוגנ'/אפקטיבי + רוחניות), עיסוק, סביבה; ממוקד-מטופל.", "cl": [1, 18]}, {"k": "PEOP", "v": "Person-Environment-Occupation-Performance — אינטראקציה בין אדם, סביבה ועיסוק; תוצר = ביצוע ורווחה (well-being).", "cl": [1, 18]}, {"k": "PEO", "v": "Person-Environment-Occupation — מודל בסיס; התאמה (fit) בין שלושת המרכיבים קובעת את איכות הביצוע.", "cl": [1]}, {"k": "ICF", "v": "International Classification of Functioning (WHO) — תפקוד גוף, פעילות, השתתפות וגורמי הקשר. Impairment=ליקוי במבנה/תפקוד גוף.", "cl": [1]}, {"k": "מתע\"ם / OTPF", "v": "מסגרת העשייה בריפוי בעיסוק — מבחין בין Domain (תחומי המקצוע) ל-Process (הערכה-התערבות-תוצאות).", "cl": [1]}, {"k": "EHP", "v": "Ecology of Human Performance (Dunn) — אסטרטגיות: Establish/Restore, Adapt/Modify, Alter, Prevent, Create.", "cl": [1]}, {"k": "KAWA", "v": "מודל הנהר — מטאפורה תרבותית; מים=זרימת חיים, אבנים=בעיות, סלעים=סביבה. שיפור ע\"י הרחבת מרחב הזרימה.", "cl": [1]}, {"k": "IRM", "v": "Intentional Relationship Model (Taylor) — שש מודות קשר טיפולי: מאמת, שותף, אמפתי, מעודד, פותר בעיות, מנחה.", "cl": [1, 3]}, {"k": "OPC", "v": "Occupational Performance Coaching — אימון ההורה/מטופל לזהות מטרות ולפתור חסמים; לא הדרכה ישירה אלא הכוונה.", "cl": [5, 4]}, {"k": "Brunnstrom", "v": "שלבי התאוששות מוטורית אחרי CVA — מרפיון, דרך תבניות סינרגיה וספסטיות, לתנועות רצוניות מבודדות.", "cl": [12]}, {"k": "NDT / Bobath", "v": "Neurodevelopmental Treatment — מעכב תבניות פתולוגיות/רפלקסים, מקדם תנועה תקינה דרך handling במהלך פעילות תפקודית.", "cl": [8, 12]}, {"k": "CIMT", "v": "Constraint-Induced Movement Therapy — ריסון הגף הבריא + תרגול מאסיבי (shaping) של הגף הפגוע; מתגבר על 'אי-שימוש נלמד'.", "cl": [12]}, {"k": "Mirror therapy", "v": "טיפול במראה — המראה משקפת את הגף הבריא כאילו הוא הפגוע; לכאב פנטום ולשיקום מוטורי אחרי CVA.", "cl": [12, 9]}, {"k": "CO-OP", "v": "Cognitive Orientation to daily Occupational Performance — Goal-Plan-Do-Check + גילוי מודרך; פותח ל-DCD. דורש יכולות קוגניטיביות-שפתיות.", "cl": [5, 18]}, {"k": "Cog-Fun", "v": "Cognitive-Functional — התערבות תפקודים ניהוליים דרך עיסוק יומיומי, תיווך מטה-קוגניטיבי ושיתוף הורה (בעיקר ADHD).", "cl": [4, 13]}, {"k": "DCI", "v": "Dynamic Cognitive Intervention (Katz) — מבוסס למידה מתווכת (Feuerstein); דגש על הכללה והעברה (transfer) של אסטרטגיות בין הקשרים.", "cl": [13]}, {"k": "Multicontext (Toglia)", "v": "גישת ריבוי-הקשרים — תרגול אסטרטגיה אחת על פני מטלות וסביבות מגוונות כדי לקדם העברה (transfer) ומודעות עצמית.", "cl": [13]}, {"k": "Dynamic Interactional Model", "v": "מודל Toglia — קוגניציה כתוצר אינטראקציה בין אדם-מטלה-סביבה; דגש על מודעות עצמית, אסטרטגיות והעברה.", "cl": [13]}, {"k": "Motor learning", "v": "עקרונות למידה מוטורית — סוגי תרגול (מקובץ/אק /* ---------- persistence ---------- */
function loadState(){ try{return JSON.parse(localStorage.getItem(STORE))||{};}catch(e){console.warn('State load failed',e);return {};} }
function saveState(s){ try{localStorage.setItem(STORE, JSON.stringify(s));}catch(e){if(e.name==='QuotaExceededError')toast('⚠️ זיכרון מלא — מחקי נתונים ישנים');} }
function exportBackup(){
  const data=JSON.stringify({STATE,version:'1',exported:new Date().toISOString()},null,2);
  const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='סימולטור-גיבוי-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  STATE.lastBackup=Date.now();saveState(STATE);toast('💾 הגיבוי הורד — שמרי אותו בתיקיית OneDrive');
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let inc;
    try{ const p=JSON.parse(reader.result); inc=(p&&p.STATE)?p.STATE:p; }
    catch(e){ toast('⚠️ הקובץ אינו תקין'); return; }
    if(!inc||typeof inc!=='object'||(!('history'in inc)&&!('srs'in inc))){ toast('⚠️ זה אינו קובץ גיבוי של הסימולטור'); return; }
    const n=(inc.history||[]).length;
    if(!confirm('לשחזר נתונים מהקובץ?\nההתקדמות הנוכחית תוחלף ב-'+n+' מבחנים/תרגולים מהגיבוי.')) return;
    STATE=inc;
    STATE.history=STATE.history||[]; STATE.srs=STATE.srs||{}; STATE.flags=STATE.flags||{};
    STATE.theme=STATE.theme||'light'; STATE.fontScale=STATE.fontScale||1; STATE.contrast=STATE.contrast||'normal';
    saveState(STATE); applyDisplay(); renderHome();
    toast('✓ הנתונים שוחזרו בהצלחה');
  };
  reader.onerror=()=>toast('⚠️ שגיאה בקריאת הקובץ');
  reader.readAsText(file);
}
let STATE = loadState();
STATE.history = STATE.history || [];
STATE.srs = STATE.srs || {};
STATE.flags = STATE.flags || {};
STATE.theme = STATE.theme || 'light';
STATE.fontScale = STATE.fontScale || 1;        /* בקרת גודל גופן A-/A+ */
STATE.contrast = STATE.contrast || 'normal';    /* normal | high */
STATE.dailyGoal = STATE.dailyGoal || 20;       /* יעד שאלות יומי */
STATE.streak = STATE.streak || 0;              /* רצף ימי לימוד */
STATE.daily = STATE.daily || {day:'', count:0};/* התקדמות היום */
STATE.lastActiveDay = STATE.lastActiveDay || '';
STATE.onboarded = STATE.onboarded || false;    /* האם הוצג מסך פתיחה */

/* ---------- daily streak + goal tracking ---------- */
function dayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function bumpDaily(){
  const tk=dayKey();
  if(STATE.daily.day!==tk){
    const y=new Date(); y.setDate(y.getDate()-1);
    STATE.streak = (STATE.lastActiveDay===dayKey(y)) ? (STATE.streak||0)+1 : 1;
    STATE.daily={day:tk, count:0};
    STATE.lastActiveDay=tk;
  }
  STATE.daily.count++;
}
function streakBroken(){ /* if last activity wasn't today or yesterday, streak is stale → 0 */
  if(!STATE.lastActiveDay) return true;
  const y=new Date(); y.setDate(y.getDate()-1);
  return STATE.lastActiveDay!==dayKey() && STATE.lastActiveDay!==dayKey(y);
}
function todayCount(){ return STATE.daily.day===dayKey() ? STATE.daily.count : 0; }

/* ---------- display settings: theme / font-size / contrast ---------- */
const FS_MIN=0.85, FS_MAX=1.4, FS_STEP=0.075;
function applyDisplay(){
  const root=document.documentElement;
  root.setAttribute('data-theme', STATE.theme);
  root.setAttribute('data-contrast', STATE.contrast);
  root.style.setProperty('--fs', STATE.fontScale);
  const tb=document.getElementById('themeBtn');

/* ---------- glossary auto-linking in explanations ---------- */
/* Wrap Latin glossary terms appearing in explanation text with a clickable popup */
const GLOSS_BYKEY={}; Object.keys(GLOSSARY).forEach(cat=>GLOSSARY[cat].forEach(it=>{GLOSS_BYKEY[it.k]=it;}));
const GLOSS_LINK=(function(){
  const map={}, aliases=[]; const STOP=new Set(['AT','P','PS','OR','IN','ON']);
  Object.keys(GLOSSARY).forEach(cat=>GLOSSARY[cat].forEach(it=>{
    it.k.split('/').forEach(raw=>{
      let a=raw.replace(/\(.*?\)/g,'').replace(/—.*$/,'').trim();
      if(!/[A-Za-z]/.test(a)) return;            /* only Latin-bearing aliases */
      if(a.indexOf('&')>=0) return;               /* skip & (HTML-escaped, won't match) */
      if(a.length<2||STOP.has(a.toUpperCase())) return;
      const key=a.toLowerCase();
      if(!(key in map)){ map[key]=it; aliases.push(a); }
    });
  }));
  if(!aliases.length) return null;
  aliases.sort((x,y)=>y.length-x.length);
  const re2=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  let re; try{ re=new RegExp('(?<![A-Za-z])('+aliases.map(re2).join('|')+')(?![A-Za-z])','gi'); }
  catch(e){ re=new RegExp('\\b('+aliases.map(re2).join('|')+')\\b','gi'); } /* fallback if no lookbehind */
  return {map,re};
})();
function linkExpl(raw){
  let s=esc(raw);
  if(!GLOSS_LINK) return s;
  const seen=new Set();
  return s.replace(GLOSS_LINK.re,(m)=>{
    const it=GLOSS_LINK.map[m.toLowerCase()];
    if(!it) return m;
    if(seen.has(it.k)) return m;                  /* link first occurrence only per text */
    seen.add(it.k);
    return `<span class="gloss-link" data-gk="${esc(it.k)}" role="button" tabindex="0">${m}</span>`;
  });
}
function showGlossPop(it){
  const w=el(`<div class="gpop-wrap"><div class="gpop" role="dialog" aria-label="הגדרה">
    <h3>${esc(it.k)}</h3><div class="gpv">${esc(it.v)}</div>

function ringSVG(pct, size, stroke, color, light){

/* ---------- SRS mistakes bank ---------- */
/* ---- Leitner spaced repetition: box -> days until next review ---- */
const SRS_INT=[0,1,3,8,21]; const SRS_GRAD=SRS_INT.length; const SRS_DAY=86400000;
function recordResult(qid, correct, pickedOi){
  const s = STATE.srs[qid] || {streak:0, wrongCount:0, seen:0, correct:0, box:0};
  s.seen=(s.seen||0)+1;
  if(correct){
    s.correct=(s.correct||0)+1; s.streak=(s.streak||0)+1;
    s.box=Math.min((s.box||0)+1, SRS_GRAD);
  } else {
    s.streak=0; s.wrongCount=(s.wrongCount||0)+1; s.lastWrong=Date.now(); s.box=0;
    if(pickedOi!=null){ s.picks=s.picks||{}; s.picks[pickedOi]=(s.picks[pickedOi]||0)+1; } // tally chosen distractor
  }
  s.last=Date.now();
  s.due = (s.box>=SRS_GRAD) ? null : Date.now() + SRS_INT[s.box]*SRS_DAY;
  STATE.srs[qid]=s;
  bumpDaily();   /* update daily count + streak on every answered question */
}
/* due for review now (wrong before, not yet mastered, and its interval elapsed) */
function mistakeIds(){ const now=Date.now(); return Object.keys(STATE.srs).filter(id=>{const s=STATE.srs[id];return s && s.wrongCount>0 && (s.box||0)<SRS_GRAD && (s.due==null || s.due<=now);}); }
/* all questions still being learned (wrong before, not mastered) */
function learningIds(){ return Object.keys(STATE.srs).filter(id=>{const s=STATE.srs[id];return s && s.wrongCount>0 && (s.box||0)<SRS_GRAD;}); }
/* mastered (graduated out of the bank) */
function masteredIds(){ return Object.keys(STATE.srs).filter(id=>{const s=STATE.srs[id];return s && s.wrongCount>0 && (s.box||0)>=SRS_GRAD;}); }
/* accuracy אמיתי לאשכול: סך תשובות נכונות חלקי סך הניסיונות + כמה שאלות נראו */
function clusterAccuracy(cid){
  let att=0,cor=0,seen=0;
  BANK.filter(q=>q.cluster===cid).forEach(q=>{const s=STATE.srs[q.id]; if(s&&s.seen){seen++; att+=s.seen; cor+=(s.correct||0);}});
  return {pct: att?Math.round(cor/att*100):0, seen, att};
}

/* ===================== PROGRESS / DASHBOARD BY TOPIC ===================== */
/* SVG trend chart of scores over time; target line at 75% */
function progressChart(hist){
  const data=hist.filter(h=>typeof h.score==='number');
  if(data.length<2) return null;
  const W=320,H=140,padX=20,padT=12,padB=22, n=data.length;
  const X=i=> padX + (W-2*padX)*(n===1?0.5:i/(n-1));
  const Y=v=> (H-padB) - (H-padT-padB)*(v/100);
  let line='';
  data.forEach((h,i)=>{ line+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(h.score).toFixed(1)+' '; });
  const area=line+`L${X(n-1).toFixed(1)} ${(H-padB)} L${X(0).toFixed(1)} ${(H-padB)} Z`;
  const grid=[0,50,100].map(v=>`<line x1="${padX}" x2="${W-padX}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--border-2)" stroke-width="1" ${v===0?'':'stroke-dasharray="2 3"'}/><text class="axlbl" x="${padX-4}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
  const tgt=`<line x1="${padX}" x2="${W-padX}" y1="${Y(75).toFixed(1)}" y2="${Y(75).toFixed(1)}" stroke="var(--ok)" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/><text class="tgtlbl" x="${W-padX}" y="${(Y(75)-4).toFixed(1)}" text-anchor="end">יעד 75%</text>`;
  const dots=data.map((h,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(h.score).toFixed(1)}" r="3.4" fill="${clusterColorHex(h.score)}" stroke="var(--surface)" stroke-width="1.6"><title>${h.mode==='exam'?'מבחן':'תרגול'} · ${h.score}%</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף ציונים לאורך זמן">
    <defs><linearGradient id="pcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".26"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${tgt}
    <path d="${area}" fill="url(#pcg)"/>
    <path d="${line}" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text class="axlbl" x="${padX}" y="${H-6}" text-anchor="start">ישן</text>
    <text class="axlbl" x="${W-padX}" y="${H-6}" text-anchor="end">אחרון</text>
  </svg>`;
}

/* ===================== DISTRACTOR ANALYTICS ===================== */
/* aggregate which wrong options were chosen, per question */
function trapData(){
  const traps=[], singles=[]; let totalPicks=0;
  Object.keys(STATE.srs).forEach(id=>{
    const s=STATE.srs[id]; if(!s||!s.picks)return;
    const q=BANK.find(x=>x.id===id); if(!q)return;
    let domOi=null,domN=0,sum=0,distinct=0;
    Object.keys(s.picks).forEach(k=>{const n=s.picks[k]; sum+=n; distinct++; if(n>domN){domN=n;domOi=+k;}});
    if(!sum)return; totalPicks+=sum;
    const rec={q,s,domOi,domN,sum,distinct};
    (domN>=2 ? traps : singles).push(rec);
  });
  traps.sort((a,b)=> (b.domN-a.domN) || (b.sum-a.sum));
  singles.sort((a,b)=> ((b.s.wrongCount||0)-(a.s.wrongCount||0)));
  return {traps,singles,totalPicks};
}

    <div style="margin:6px 0;line-height:1.6"><span class="chip red">🪤 המסיח שתפס אותך</span> <b>${esc(q.options[t.domOi])}</b></div>
    ${t.distinct>1?'<div class="faint" style="font-size:.8rem;margin-bottom:4px">בשאלה זו בחרת יותר ממסיח שגוי אחד.</div>':''}
    <div style="margin-top:6px">${linkExpl(q.explanation)}</div>
    <button class="btn ghost" style="margin-top:10px">תרגלי שאלה זו ←</button></div>`);
  card.querySelector('button').onclick=()=>runPractice([q],'תרגול ממוקד',{});
  return card;
}

  const {traps,singles,totalPicks}=trapData();
  const node=el('<div class="stack"></div>');

function runPractice(questions, title, opts){
  let i=0, correct=0, answered=0;
  const flags=new Array(questions.length).fill(false);
  questions.forEach((q,idx)=>{if(STATE.flags[q.id])flags[idx]=true;});
  function render(){
    if(i>=questions.length) return practiceDone();
    const q=questions[i], rq=buildRuntimeQ(q,true);
    const node=el('<div></div>');
    node.appendChild(el(`<section class="card">
      <div class="qtop"><button class="btn ghost" id="bk">→ יציאה</button><span class="sp" style="flex:1"></span><span class="chip blue">${esc(title)}</span><button class="btn ghost flagbtn ${flags[i]?'on':''}" id="flag" aria-pressed="${flags[i]}" aria-label="סימון לחזרה">⚑</button></div>
      <div class="qprog"><i style="width:${Math.round(i/questions.length*100)}%"></i></div>
      <div class="qmeta">שאלה ${i+1} מתוך ${questions.length} · אשכול ${q.cluster}</div>
      <div class="qtext" id="qt">${esc(q.q)}</div>
      <div class="opts" id="opts" role="group" aria-labelledby="qt"></div>
      <div id="fb"></div>
      <div class="navrow"><span></span><button class="btn" id="next" style="display:none">המשך →</button></div>
    </section>`));
    node.querySelector('#bk').onclick=()=>{ if(confirm('לצאת מהתרגול? ההתקדמות תישמר.')) renderHome(); };
    const optsEl=node.querySelector('#opts'); let locked=false;
    rq.opts.forEach((o,idx)=>{
      const b=el(`<button class="opt" data-i="${idx}"><span class="lett" aria-hidden="true">${LETT[idx]}</span><span class="otext">${esc(o.text)}</span></button>`);
      b.setAttribute('aria-label',`תשובה ${LETT[idx]}: ${o.text}`);
      b.onclick=()=>choose(idx); optsEl.appendChild(b);
    });
    function choose(idx){
      if(locked)return; locked=true; answered++;
      const isC=rq.opts[idx].correct; if(isC)correct++;
      recordResult(q.id,isC,isC?null:rq.opts[idx].oi); saveState(STATE); refreshNavBadge();
      [...optsEl.children].forEach((b,bi)=>{b.setAttribute('aria-disabled','true');
        if(rq.opts[bi].correct)b.classList.add('correct'); else if(bi===idx)b.classList.add('wrong');});
      const fbBox=el(`<div class="feedback ${isC?'ok':'bad'}" role="alert">
        <b>${isC?'✓ תשובה נכונה':'✗ תשובה שגויה'}</b>
        <div style="margin-top:6px">${linkExpl(q.explanation)}</div>
        ${q.flag?'<div class="src"><span>⚑</span><span>שאלה מסומנת לבדיקה</span></div>':''}</div>`);
      // per-option rationale (hybrid: shown only when the question has opt_why content)
      // correct answer explained separately from the distractors' rationale
      if(q.opt_why && q.opt_why.length){
        const chosenOpt=rq.opts[idx];
        let owk=0;
        const mkRow=(o)=>{
          const why=q.opt_why[o.oi]||'';
          const cls=o.correct?'ok':(o===chosenOpt?'bad':'neu');
          const ic=o.correct?'✓':(o===chosenOpt?'✗':'·');
          const r=el(`<div class="owrow ${cls}"><div class="owh"><span class="owi">${ic}</span><span class="owt">${esc(o.text)}</span></div>${why?`<div class="owwhy">${esc(why)}</div>`:''}</div>`);
          r.style.animationDelay=(owk++*0.05)+'s';
          return r;
        };
        const ow=el('<div class="optwhy"></div>');
        const correctOpt=rq.opts.find(o=>o.correct);
        ow.appendChild(el('<div class="owttl ok-ttl">✓ התשובה הנכונה</div>'));
        if(correctOpt) ow.appendChild(mkRow(correctOpt));
        ow.appendChild(el('<div class="owttl wrong-ttl">למה התשובות האחרות שגויות</div>'));
        rq.opts.filter(o=>!o.correct).forEach(o=>ow.appendChild(mkRow(o)));
        fbBox.appendChild(ow);
      }
      node.querySelector('#fb').appendChild(fbBox);
      try{ if(!matchMedia('(prefers-reduced-motion: reduce)').matches) fbBox.scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){}
      const nb=node.querySelector('#next'); nb.style.display=''; nb.textContent=(i+1>=questions.length)?'סיום →':'המשך →'; nb.focus();
    }
    node.querySelector('#next').onclick=()=>{i++;render();};
    const flagBtn=node.querySelector('#flag');
    flagBtn.onclick=()=>{flags[i]=!flags[i]; if(flags[i])STATE.flags[q.id]=true; else delete STATE.flags[q.id]; saveState(STATE); flagBtn.classList.toggle('on',flags[i]); flagBtn.setAttribute('aria-pressed',flags[i]);};
    setScreen(node, opts.mixed?'exam':(opts.mistakes?'mistakes':'topics'), true);
    keyHandler(rq.opts.length, choose, ()=>{const nb=node.querySelector('#next'); if(nb.style.display!=='none')nb.click();});
  }
  function practiceDone(){
    const score=answered?Math.round(correct/answered*100):0;
    const flagged=flags.filter((f,i)=>f).length;
    STATE.history.push({t:Date.now(),mode:'practice',title,score,correct,total:answered}); saveState(STATE);
    const node=el('<div class="stack"></div>');
    node.appendChild(el(`<section class="card" style="text-align:center">
      <h1>סיום תרגול</h1><p class="muted" style="margin:4px 0 14px">${esc(title)}</p>
      <div class="bigring">${ringSVG(score,140,12,clusterColorHex(score),false)}<div class="muted">${correct} נכונות מתוך ${answered}</div></div>
      ${flagged?`<div style="margin-top:12px;padding:12px;background:var(--flag);color:#fff;border-radius:10px;font-size:.9rem">📌 ${flagged} שאלות סומנו לחזרה</div>`:''}
      <div class="navrow" style="justify-content:center;margin-top:18px">
        <button class="btn secondary" id="again">תרגול נוסף</button><button class="btn" id="home">למסך הבית</button></div></section>`));
    node.querySelector('#home').onclick=renderHome;
    node.querySelector('#again').onclick=()=>{ if(opts.mistakes)startMistakes(); else if(opts.mixed)renderMixedExam(); else startTopic(opts.cluster); };
    setScreen(node,'home');
  }
  render();
}

/* ===================== FULL EXAM ===================== */
function confirmStartExam(){
  if(confirm(`מבחן מלא: ${EXAM_SIZE} שאלות בתנאי אמת (טיימר, ערבוב, סימון לחזרה).\nלהתחיל עכשיו?`)) startExam();
}
const dkey=q=>q.dgroup||q.id; /* dedup key: duplicate questions share a dgroup so only one appears per exam */
function sampleExam(){
  let picked=[]; const chosen=new Set();
  CLUSTERS.forEach(c=>{ const pool=shuffle(BANK.filter(q=>q.cluster===c.id)); let added=0;
    for(const q of pool){ if(added>=c.weight)break; if(chosen.has(dkey(q)))continue; chosen.add(dkey(q)); picked.push(q); added++; } });
  if(picked.length<EXAM_SIZE){ const rest=shuffle(BANK.filter(q=>!chosen.has(dkey(q)))); for(const q of rest){ if(picked.length>=EXAM_SIZE)break; chosen.add(dkey(q)); picked.push(q); } }
  else if(picked.length>EXAM_SIZE){ picked=shuffle(picked).slice(0,EXAM_SIZE); }
  return shuffle(picked).map(q=>buildRuntimeQ(q,true));
}
function startExam(items){
  if(!items) items=sampleExam();
  const ans=new Array(items.length).fill(null), flags=new Array(items.length).fill(false);
  let cur=0; const start=Date.now(); let timerInt;
  function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);
    return (h>0?String(h).padStart(2,'0')+':':'')+String(m%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  function render(){
    const rq=items[cur], q=rq.ref;
    const node=el('<div></div>');
    node.appendChild(el(`<section class="card">
      <div class="qtop"><button class="btn ghost" id="quit">יציאה</button><span class="sp" style="flex:1"></span>
        <span class="timer" id="tm" aria-live="polite" aria-label="זמן שחלף">00:00</span>
        <button class="btn ghost flagbtn ${flags[cur]?'on':''}" id="flag" aria-pressed="${flags[cur]}">⚑ לחזור</button></div>
      <div class="qprog"><i style="width:${Math.round((cur+1)/items.length*100)}%"></i></div>
      <div class="qmeta">שאלה ${cur+1} מתוך ${items.length} · נענו ${ans.filter(a=>a!==null).length}</div>
      <div class="qtext" id="qt">${esc(q.q)}</div>
      <div class="opts" id="opts" role="group" aria-labelledby="qt"></div>
      <div class="navrow"><button class="btn secondary" id="prev" ${cur===0?'disabled':''}>← הקודמת</button>
        <button class="btn" id="next">${cur+1>=items.length?'לסיום ולתוצאות':'הבאה →'}</button></div>
      <details class="gnav"><summary>מפת שאלות וניווט מהיר</summary><div class="gridnav" id="gn"></div>
        <div style="padding:0 14px 14px"><button class="btn secondary wide" id="submit">סיום והצגת תוצאות</button></div></details>
    </section>`));
    node.querySelector('#quit').onclick=()=>{ if(confirm('לצאת מהמבחן? התוצאה לא תישמר. בטוח?')){clearInterval(timerInt);renderHome();toast('המבחן בוטל');} };
    const optsEl=node.querySelector('#opts');
    rq.opts.forEach((o,idx)=>{
      const b=el(`<button class="opt ${ans[cur]===idx?'sel':''}" data-i="${idx}"><span class="lett" aria-hidden="true">${LETT[idx]}</span><span class="otext">${esc(o.text)}</span></button>`);
      b.setAttribute('aria-label',`תשובה ${LETT[idx]}: ${o.text}`); b.setAttribute('aria-pressed', ans[cur]===idx);
      b.onclick=()=>{ans[cur]=idx;[...optsEl.children].forEach((x,xi)=>{x.classList.toggle('sel',xi===idx);x.setAttribute('aria-pressed',xi===idx);});};
      optsEl.appendChild(b);
    });
    const flagBtn=node.querySelector('#flag');
    flagBtn.onclick=()=>{flags[cur]=!flags[cur];flagBtn.classList.toggle('on',flags[cur]);flagBtn.setAttribute('aria-pressed',flags[cur]);};
    node.querySelector('#prev').onclick=()=>{if(cur>0){cur--;render();}};
    node.querySelector('#next').onclick=()=>{ if(cur+1>=items.length)finish(); else {cur++;render();} };
    node.querySelector('#submit').onclick=()=>{ const un=ans.filter(a=>a===null).length; if(un && !confirm(`נותרו ${un} שאלות ללא מענה. לסיים בכל זאת?`))return; finish(); };
    const gn=node.querySelector('#gn');
    items.forEach((_,k)=>{const b=el(`<button aria-label="שאלה ${k+1}">${k+1}</button>`);
      if(ans[k]!==null)b.classList.add('answered'); if(flags[k])b.classList.add('flagged'); if(k===cur)b.classList.add('current');
      b.onclick=()=>{cur=k;render();}; gn.appendChild(b);});
    setScreen(node,'exam',true);
    const tm=node.querySelector('#tm'); clearInterval(timerInt);
    timerInt=setInterval(()=>{
      const elapsed=Date.now()-start;
      tm.textContent=fmt(elapsed);
      if(elapsed>MAX_TIME_EXAM_MS){clearInterval(timerInt);toast('⏱ הזמן הסתיים! מעבירים לסיום המבחן.');setTimeout(()=>finish(),500);}
    },500); tm.textContent=fmt(Date.now()-start);
    keyHandler(rq.opts.length,(idx)=>{ans[cur]=idx;render();},()=>node.querySelector('#next').click(),()=>node.querySelector('#prev').click());
  }
  function finish(){
    clearInterval(timerInt); const elapsed=Date.now()-start;
    let correct=0; const perCluster={}; const wrong=[];
    items.forEach((rq,k)=>{const q=rq.ref; const cc=perCluster[q.cluster]=perCluster[q.cluster]||{c:0,t:0}; cc.t++;
      const isC=ans[k]!==null && rq.opts[ans[k]].correct; if(isC){correct++;cc.c++;}
      recordResult(q.id,isC,(isC||ans[k]==null)?null:rq.opts[ans[k]].oi); if(!isC)wrong.push({rq,chosen:ans[k]});});
    const score=Math.round(correct/items.length*100);
    STATE.history.push({t:Date.now(),mode:'exam',score,correct,total:items.length,ms:elapsed}); saveState(STATE);
    showResults({score,correct,total:items.length,elapsed,perCluster,wrong,fmt});
  }
  render();
}

/* ===================== MIXED PRACTICE EXAMS ===================== */
function buildMixedSet(size){
  const totalW=CLUSTERS.reduce((s,c)=>s+c.weight,0);
  let picked=[]; const chosen=new Set();
  CLUSTERS.forEach(c=>{
    const pool=shuffle(BANK.filter(q=>q.cluster===c.id));
    const n=Math.round(c.weight/totalW*size); let added=0;
    for(const q of pool){ if(added>=n)break; if(chosen.has(dkey(q)))continue; chosen.add(dkey(q)); picked.push(q); added++; }
  });
  if(picked.length<size){ const rest=shuffle(BANK.filter(q=>!chosen.has(dkey(q)))); for(const q of rest){ if(picked.length>=size)break; chosen.add(dkey(q)); picked.push(q); } }
  else if(picked.length>size){ picked=shuffle(picked).slice(0,size); }
  return shuffle(picked);
}

    const node=el('<div class="stack"></div>');

     {k:'immediate',t:'משוב מיידי',d:'אחרי כל שאלה — נכון/שגוי, הסבר ומקור (מצב לימוד)'}].forEach(m=>{

      const qs=buildMixedSet(size);
      if(mode==='real'){

/* ===================== CUSTOM EXAM BUILDER ===================== */
function clusterPoolCount(cid, source){
  let pool=BANK.filter(q=>q.cluster===cid);
  if(source==='mistakes'){ const m=new Set(mistakeIds()); pool=pool.filter(q=>m.has(q.id)); }
  else if(source==='unseen'){ pool=pool.filter(q=>{const s=STATE.srs[q.id]; return !s||!s.seen;}); }
  const seen=new Set(); let n=0; pool.forEach(q=>{ if(!seen.has(dkey(q))){seen.add(dkey(q));n++;} }); return n;
}
function buildCustomSet(clusters, size, source){
  let pool=BANK.filter(q=>clusters.has(q.cluster));
  if(source==='mistakes'){ const m=new Set(mistakeIds()); pool=pool.filter(q=>m.has(q.id)); }
  else if(source==='unseen'){ pool=pool.filter(q=>{const s=STATE.srs[q.id]; return !s||!s.seen;}); }
  const chosen=new Set(); const dedup=[];
  shuffle(pool).forEach(q=>{ if(!chosen.has(dkey(q))){chosen.add(dkey(q));dedup.push(q);} });
  return shuffle(dedup).slice(0, size);
}
function renderCustomExam(){
  const sel=new Set(CLUSTERS.map(c=>c.id));
  let source='all', style='real', size=40;
  const avail=()=>{ let n=0; sel.forEach(cid=>n+=clusterPoolCount(cid,source)); return n; };
  function draw(){
    const max=avail();
    if(size>max) size=max;
    if(size<1 && max>0) size=Math.min(20,max);
    const node=el('<div class="stack"></div>');
    node.appendChild(el(`<section class="card">
      <div class="qtop"><button class="btn ghost" id="bk">→ חזרה</button><span class="sp" style="flex:1"></span><span class="chip teal">מבחן מותאם</span></div>
      <h1 style="margin-top:12px">בונה מבחן מותאם אישית</h1>
      <p class="muted" style="margin:6px 0 0">בחרי אילו אשכולות לכלול, מאיזה מקור, כמה שאלות ובאיזה סגנון — והמבחן ייתפר אישית עבורך.</p></section>`));
    node.querySelector('#bk').onclick=renderHome;

    const clCard=el('<section class="card"></section>');
    clCard.appendChild(el('<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0;flex:1">אשכולות</h2><button class="btn ghost" id="selAll" style="padding:5px 11px;font-size:.8rem">בחרי הכל</button><button class="btn ghost" id="selNone" style="padding:5px 11px;font-size:.8rem">נקי</button></div>'));
    const grid=el('<div class="clgrid"></div>');
    CLUSTERS.forEach(c=>{
      const cnt=clusterPoolCount(c.id,source);
      const b=el(`<button class="cltog ${sel.has(c.id)?'on':''}" ${cnt===0?'disabled':''} aria-pressed="${sel.has(c.id)}"><span class="cn">${c.id}</span><span class="cnm">${esc(c.name)}<div class="ccount">${cnt} שאלות</div></span></button>`);
      if(cnt>0) b.onclick=()=>{ if(sel.has(c.id))sel.delete(c.id); else sel.add(c.id); draw(); };
      grid.appendChild(b);
    });
    clCard.appendChild(grid);
    clCard.querySelector('#selAll').onclick=()=>{CLUSTERS.forEach(c=>{if(clusterPoolCount(c.id,source)>0)sel.add(c.id);});draw();};
    clCard.querySelector('#selNone').onclick=()=>{sel.clear();draw();};
    node.appendChild(clCard);

    const srcCard=el('<section class="card"><h2 style="margin:0 0 4px">מקור השאלות</h2></section>');
    const srcWrap=el('<div class="stack"></div>');
    [{k:'all',t:'כל השאלות',d:'מכל האשכולות שנבחרו'},
     {k:'unseen',t:'רק שאלות שטרם תרגלתי',d:'להרחבת הכיסוי של המאגר'},
     {k:'mistakes',t:'רק שאלות שטעיתי בהן',d:'חיזוק ממוקד מתוך מאגר הטעויות'}].forEach(m=>{
      const b=el(`<button class="opt ${m.k===source?'sel':''}" style="text-align:right"><span class="otext"><b>${m.t}</b><br><span class="muted" style="font-size:.85rem">${m.d}</span></span></button>`);
      b.onclick=()=>{source=m.k;draw();}; srcWrap.appendChild(b);
    });
    srcCard.appendChild(srcWrap); node.appendChild(srcCard);

    const cntCard=el('<section class="card"></section>');
    cntCard.appendChild(el(`<div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0;flex:1">מספר שאלות</h2><span class="faint" style="font-size:.82rem">זמין: ${max}</span></div>`));
    if(max===0){
      cntCard.appendChild(el('<p class="muted" style="margin:8px 0 0">אין שאלות זמינות לבחירה הנוכחית. בחרי אשכולות נוספים או מקור אחר.</p>'));
    } else {
      const rw=el('<div class="rangewrap"></div>');
      const val=el(`<span class="rangeval">${size}</span>`);
      const rng=el(`<input type="range" class="qrange" min="1" max="${max}" value="${size}" aria-label="מספר שאלות">`);
      rng.oninput=()=>{ size=+rng.value; val.textContent=size; const g=node.querySelector('#go'); if(g)g.textContent='התחילי מבחן · '+size+' שאלות'; };
      rw.append(val,rng); cntCard.appendChild(rw);
      const presets=el('<div class="navrow" style="gap:8px;margin-top:10px"></div>');
      [10,20,40,max].filter((v,i,a)=>v<=max && v>=1 && a.indexOf(v)===i).forEach(p=>{
        const b=el(`<button class="btn ${p===size?'':'secondary'}" style="flex:1">${p===max?'הכל ('+max+')':p}</button>`);
        b.onclick=()=>{size=p;draw();}; presets.appendChild(b);
      });
      cntCard.appendChild(presets);
    }
    node.appendChild(cntCard);

    const styCard=el('<section class="card"><h2 style="margin:0 0 4px">סגנון</h2></section>');
    const styWrap=el('<div class="stack"></div>');
    [{k:'real',t:'תנאי אמת',d:'טיימר · התוצאות וההסברים בסוף, כמו במבחן האמיתי'},
     {k:'immediate',t:'משוב מיידי',d:'אחרי כל שאלה — נכון/שגוי, הסבר מלא לכל תשובה ומקור (מצב לימוד)'}].forEach(m=>{
      const b=el(`<button class="opt ${m.k===style?'sel':''}" style="text-align:right"><span class="otext"><b>${m.t}</b><br><span class="muted" style="font-size:.85rem">${m.d}</span></span></button>`);
      b.onclick=()=>{style=m.k;draw();}; styWrap.appendChild(b);
    });
    styCard.appendChild(styWrap); node.appendChild(styCard);

    const go=el(`<button class="btn wide" id="go" ${max===0?'disabled':''} style="margin-top:2px">התחילי מבחן · ${size} שאלות</button>`);
    go.onclick=()=>{
      if(!sel.size) return toast('בחרי לפחות אשכול אחד');
      const qs=buildCustomSet(sel,size,source);
      if(!qs.length) return toast('אין שאלות מתאימות לבחירה');
      if(style==='real'){
        if(confirm(`מבחן מותאם: ${qs.length} שאלות בתנאי אמת (טיימר, ערבוב, סימון לחזרה).\nלהתחיל עכשיו?`))
          startExam(qs.map(q=>buildRuntimeQ(q,true)));
      } else {
        runPractice(qs, `מבחן מותאם · ${qs.length} שאלות`, {mixed:true});
      }
    };
    node.appendChild(go);
    setScreen(node,'exam');
  }
  draw();
}

/* ===================== RESULTS ===================== */
function showResults(r){
  const node=el('<div class="stack"></div>');
  const pass = r.score>=75;
  node.appendChild(el(`<section class="card hero" style="text-align:center">
    <div class="greet">${pass?'עברת את הסף · '+r.score+'%':'סיכום המבחן'}</div>
    <div class="bigring" style="margin-top:10px">${ringSVG(r.score,150,13,clusterColorHex(r.score),false)}</div>
    <div class="sub muted" style="margin-top:10px">${r.correct} נכונות · ${r.total-r.correct} שגויות · זמן ${r.fmt(r.elapsed)}</div>
  </section>`));

  const bd=el(`<section class="card"><h2>פירוק לפי נושא</h2><p class="muted" style="margin:2px 0 10px">ירוק ≥75% · כתום 50–74% · אדום &lt;50%</p><div class="breakdown" id="bd"></div></section>`);
  const bdEl=bd.querySelector('#bd'); const weak=[];
  CLUSTERS.forEach(c=>{const cc=r.perCluster[c.id]; if(!cc)return; const p=Math.round(cc.c/cc.t*100);
    if(p<75)weak.push({c,p});
    bdEl.appendChild(el(`<div class="brow"><div class="h"><span>${c.id}. ${esc(c.name)}</span><span class="chip ${clusterColor(p)}">${cc.c}/${cc.t} · ${p}%</span></div><div class="bar2"><i style="width:${p}%;background:${clusterColorHex(p)}"></i></div></div>`));});
  node.appendChild(bd);

  if(weak.length){
    const tp=el(`<section class="card"><h2>נושאים לחיזוק</h2></section>`);
    weak.sort((a,b)=>a.p-b.p).forEach(w=>{const tips=(TIPS[w.c.id]||[]).map(t=>`<li>${esc(t)}</li>`).join('');
      tp.appendChild(el(`<div class="tipbox"><b>${w.c.id}. ${esc(w.c.name)} — ${w.p}%</b>
        <div class="muted" style="margin-top:2px;font-size:.9rem">${w.p<50?'נדרשת חזרה יסודית על האשכול.':'כמעט שם — חידוד אחרון יסגור את הפינה.'}</div><ul>${tips}</ul></div>`));});
    node.appendChild(tp);
  } else node.appendChild(el(`<section class="card"><div class="tipbox good"><b>מצוין — אין נושאים חלשים בולטים.</b><div class="muted" style="font-size:.9rem">המשיכי לתרגל כדי לשמר את הרמה.</div></div></section>`));

  if(r.wrong.length){
    const rv=el(`<section class="card"><h2>סקירת טעויות (${r.wrong.length})</h2><p class="muted" style="margin:2px 0 6px">כל הטעויות עם התשובה הנכונה, הסבר ומקור.</p><div id="rv" class="stack"></div></section>`);
    const rvEl=rv.querySelector('#rv');
    r.wrong.forEach((w,n)=>{const q=w.rq.ref; const chosen=w.chosen!=null?w.rq.opts[w.chosen].text:'— ללא מענה —';
      rvEl.appendChild(el(`<div class="feedback bad">
        <div class="qmeta">אשכול ${q.cluster}</div>
        <div class="qtext" style="font-size:1.04rem;margin:6px 0 10px">${n+1}. ${esc(q.q)}</div>
        <div>בחרת: <b>${esc(chosen)}</b></div>
        <div>נכון: <b style="color:var(--ok)">${esc(w.rq.opts[w.rq.correctIdx].text)}</b></div>
        <div style="margin-top:6px">${linkExpl(q.explanation)}</div>
        ${q.flag?'<div class="src"><span>⚑</span><span>שאלה מסומנת לבדיקה</span></div>':''}</div>`));});
    node.appendChild(rv);
  }

  const act=el(`<div class="navrow" style="justify-content:center">
    <button class="btn secondary" id="mist">תרגול הטעויות</button>
    <button class="btn secondary" id="again">מבחן חדש</button>
    <button class="btn" id="home">למסך הבית</button></div>`);
  act.querySelector('#home').onclick=renderHome;
  act.querySelector('#again').onclick=confirmStartExam;
  act.querySelector('#mist').onclick=()=> mistakeIds().length?startMistakes():toast('אין טעויות פתוחות');
  node.appendChild(act);
  setScreen(node,'exam');
}

/* ===================== GLOSSARY ===================== */
function renderGlossary(){
  const node=el('<div class="stack"></div>');
  const clOpts=CLUSTERS.map(c=>`<option value="${c.id}">${c.id}. ${esc(c.name)}</option>`).join('');
  node.appendChild(el(`<section class="card"><h1>ראשי תיבות וגלוסר</h1>
    <p class="muted" style="margin:6px 0 12px">עזר מהיר לאבחונים, גישות, מצבים קליניים, חוקים, אנטומיה ועצבים קרניאליים — בדומה לעזר המצורף למבחן.</p>
    <input class="search" id="gs" placeholder="חיפוש: שם, ראשי תיבות או מונח…" aria-label="חיפוש בגלוסר">
    <select class="search" id="gcl" aria-label="סינון לפי אשכול" style="margin-top:10px"><option value="0">כל האשכולות</option>${clOpts}</select>
    <div class="faint" id="gcount" style="font-size:.8rem;margin-top:8px"></div>
    <div class="tabbar" id="tabs" role="tablist"></div><div id="gc"></div></section>`));
  const cats=Object.keys(GLOSSARY); let active=cats[0];
  const tabs=node.querySelector('#tabs');
  cats.forEach(cat=>{const t=el(`<button class="tab ${cat===active?'active':''}" role="tab">${esc(cat)}</button>`);
    t.onclick=()=>{active=cat; clSel.value='0'; [...tabs.children].forEach(x=>x.classList.toggle('active',x.textContent===cat));draw();}; tabs.appendChild(t);});
  const gc=node.querySelector('#gc'), search=node.querySelector('#gs'), clSel=node.querySelector('#gcl'), cnt=node.querySelector('#gcount');
  const clBadge=(it)=>(it.cl&&it.cl.length)?` <span class="gcl-badge" title="אשכולות רלוונטיים">${it.cl.join('·')}</span>`:'';
  function draw(){
    const term=(search.value||'').trim().toLowerCase();
    const cid=parseInt(clSel.value,10)||0;
    const filtering = !!term || cid>0;
    gc.innerHTML=''; let shown=0;
    (filtering?cats:[active]).forEach(cat=>{
      const items=GLOSSARY[cat].filter(it=>
        (!term||(it.k+' '+it.v).toLowerCase().includes(term)) &&
        (!cid||(it.cl&&it.cl.includes(cid)))
      );
      if(!items.length)return;
      const sec=el(`<div class="gcat"><h2>${esc(cat)}</h2></div>`);
      const addItem=(it)=>{sec.appendChild(el(`<div class="gitem"><b>${esc(it.k)}${clBadge(it)}</b><span>${esc(it.v)}</span></div>`)); shown++;};
      if(items.some(it=>it.sub)){
        [...new Set(items.map(it=>it.sub||' '))].forEach(sub=>{
          const si=items.filter(it=>(it.sub||' ')===sub);
          if(!si.length)return;
          if(sub!==' ')sec.appendChild(el(`<div class="gsub">${esc(sub)}</div>`));
          si.forEach(addItem);
        });
      } else { items.forEach(addItem); }
      gc.appendChild(sec);
    });
    cnt.textContent = filtering ? `${shown} מונחים תואמים${cid?' · אשכול '+cid:''}` : `${GLOSSARY[active].length} מונחים בקטגוריה`;
    [...tabs.children].forEach(x=>x.style.opacity = filtering?'0.45':'');
    if(!gc.children.length)gc.appendChild(el('<p class="muted" style="text-align:center;padding:20px">🔍 לא נמצאו תוצאות — נסי חיפוש אחר, אשכול אחר, או "כל האשכולות".</p>'));
  }
  search.oninput=draw; clSel.onchange=draw; draw();
  setScreen(node,'glossary');
}

/* ===================== keyboard ===================== */
function keyHandler(nOpts, choose, next, prev){
  document.onkeydown=(e)=>{
    if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
    if(e.key>='1'&&e.key<=String(nOpts)){choose(parseInt(e.key)-1);e.preventDefault();}
    else if(['א','ב','ג','ד'].includes(e.key)){const m={'א':0,'ב':1,'ג':2,'ד':3};if(m[e.key]<nOpts){choose(m[e.key]);e.preventDefault();}}
    else if(e.key==='Enter'&&next)next();
    else if(e.key==='ArrowLeft'&&prev)prev();
    else if(e.key==='ArrowRight'&&next)next();
  };
}
