     {k:'immediate',t:'משוב מיידי',d:'אחרי כל שאלה — נכון/שגוי, הסבר מלא לכל תשובה ומקור (מצב לימוד)'}].forEach(m=>{
      const b=el(`<button class="opt ${m.k===style?'sel':''}" style="text-align:right"><span class="otext"><b>${m.t}</b><br><span class="muted" style="font-size:.85rem">${m.d}</span></span></button>`);
      b.onclick=()=>{style=m.k;draw();}; styWrap.appendChild(b);

    styCard.appendChild(styWrap); node.appendChild(styCard);

    const go=el(`<button class="btn wide" id="go" ${max===0?'disabled':''} style="margin-top:2px">התחילי מבחן · ${size} שאלות</button>`);
    go.onclick=()=>{
      if(!sel.size) return toast('בחרי לפחות אשכול אחד');
      const qs=buildCustomSet(sel,size,source);
      if(!qs.length) return toast('אין שאלות מתאימות לבחירה');
      if(style==='real'){
        if(confirm(`מבחן מותאם: ${qs.length} שאלות בתנאי אמת (טיימר, ערבוב, סימון לחזרה).\nלהתחיל עכשיו?`))
          startExam(qs.map(q=>buildRuntimeQ(q,true)));
      } else {
        runPractice(qs, `מבחן מותאם · ${qs.length} שאלות`, {mixed:true});
      }
    };
    node.appendChild(go);
    const _keepY=window.scrollY;
    setScreen(node,'exam');
    if(_keepY) window.scrollTo({top:_keepY,behavior:'instant'});
  }
  draw();
}

  const itemHTML=(it)=>`<div class="gitem"><b>${esc(it.k)}${clBadge(it)}</b><span>${esc(it.v)}</span></div>`;
  function bodyHTML(items){
    if(!items.some(it=>it.sub))return items.map(itemHTML).join('');

  }

  const fl=node.querySelector('#fcLaunch'); if(fl)fl.onclick=renderFlashSetup;
  setScreen(node,'glossary');
}

  return out;
}
function renderFlashSetup(){
  STATE.fc=STATE.fc||{known:{}};

  const knownN=pool.filter(it=>STATE.fc.known[it.k]).length;
  const catOpts=cats.map(c=>`<option value="cat:${esc(c)}">${esc(c)} (${GLOSSARY[c].length})</option>`).join('');
  const clOpts=CLUSTERS.map(c=>`<option value="cl:${c.id}">אשכול ${c.id} · ${esc(c.name)}</option>`).join('');

function startFlash(list){ renderFlashCard({list, i:0, flipped:false, known:0, again:[], total:list.length}); }
function renderFlashCard(sess){
  if(sess.i>=sess.list.length) return renderFlashDone(sess);
  const it=sess.list[sess.i], pct=Math.round(sess.i/sess.total*100);
  const node=el('<div class="stack"></div>');

    <div class="fcard" id="fcCard" role="button" tabindex="0" aria-label="הקישי להיפוך הכרטיסייה">
      <div class="fc-tag">${esc(it.cat)}</div>
      <div class="fc-face" id="fcFace"><div class="fc-term">${esc(it.k)}</div><div class="fc-hint">הקישי לחשיפת ההגדרה ↡</div></div>

    </div>
  </section>`));
  const card=node.querySelector('#fcCard'), face=node.querySelector('#fcFace'), rateRow=node.querySelector('#fcRate');
  function flip(){ if(sess.flipped)return; sess.flipped=true;
    face.innerHTML=`<div class="fc-def">${esc(it.v)}</div>`; card.classList.add('flipped'); rateRow.hidden=false; }
  function rate(known){
    if(known){ STATE.fc=STATE.fc||{known:{}}; STATE.fc.known[it.k]=true; saveState(STATE); sess.known++; }
    else sess.again.push(it);
    sess.i++; sess.flipped=false; renderFlashCard(sess);
  }
  card.onclick=flip;
  rateRow.querySelector('#fcKnew').onclick=()=>rate(true);
  rateRow.querySelector('#fcAgain').onclick=()=>rate(false);
  node.querySelector('#fcExit').onclick=()=>renderFlashDone(sess);
  setScreen(node,'glossary');
  document.onkeydown=(e)=>{
    const t=document.activeElement.tagName;
    if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
    if(!sess.flipped){ if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();} }
    else if(e.key==='1'||e.key==='ArrowRight'){e.preventDefault();rate(true);}
    else if(e.key==='2'||e.key==='ArrowLeft'){e.preventDefault();rate(false);}
  };
}
function renderFlashDone(sess){
  const node=el('<div class="stack"></div>'), again=sess.again;
  node.appendChild(el(`<section class="card" style="text-align:center">
    <div style="font-size:2.4rem" aria-hidden="true">${again.length?'💪':'🎉'}</div>
    <h1 style="margin:6px 0">${again.length?'יפה! ממשיכים לחזק':'מצוין! עברת על הכול'}</h1>
    <p class="muted">סימנת <b>${sess.known}</b> כ"ידעתי"${again.length?` · <b>${again.length}</b> לחזרה`:''} מתוך ${sess.i}.</p>
    <div class="navrow" style="justify-content:center;margin-top:16px;gap:10px">
      ${again.length?`<button class="btn" id="fcRedo">חזרה על ה-${again.length} שלא ידעתי ←</button>`:''}
      <button class="btn ghost" id="fcMore">סבב חדש</button>
      <button class="btn ghost" id="fcBack">לגלוסר</button>
    </div>
  </section>`));
  const r=node.querySelector('#fcRedo'); if(r)r.onclick=()=>startFlash(shuffle(again));
  node.querySelector('#fcMore').onclick=renderFlashSetup;
  node.querySelector('#fcBack').onclick=renderGlossary;
  document.onkeydown=null;
  setScreen(node,'glossary');
}

/* ===================== keyboard ===================== */
function keyHandler(nOpts, choose, next, prev){
  document.onkeydown=(e)=>{
    if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
    if(e.key>='1'&&e.key<=String(nOpts)){choose(parseInt(e.key)-1);e.preventDefault();}
    else if(['א','ב','ג','ד'].includes(e.key)){const m={'א':0,'ב':1,'ג':2,'ד':3};if(m[e.key]<nOpts){choose(m[e.key]);e.preventDefault();}}
    else if(e.key==='Enter'&&next)next();
    else if(e.key==='ArrowRight'&&prev)prev();
    else if(e.key==='ArrowLeft'&&next)next();
  };
}

wireDisplayControls();
applyDisplay();   /* apply saved theme / contrast / font-scale on load */
renderHome();
if(!STATE.onboarded) showOnboarding();   /* first-run welcome */

/* ===================== PWA: service worker + install ===================== */
(function(){
  // Register only when served over http/https (not when opened as a local file://)
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){/* offline mode unavailable, app still works */});
    });
  }
  // "Add to home screen" (Android/Chrome). The install option lives in the settings sheet.
  // iOS uses Share → Add to Home Screen (hinted in the settings sheet).
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); window.__deferredInstall=e; });
  window.addEventListener('appinstalled',function(){ window.__deferredInstall=null; });
})();
</script>
